<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HIV Stories</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;1,400&family=Source+Sans+3:wght@300;400;600&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#ffffff;--text:#1a1614;--muted:#7a7068;
  --red:#c41230;--line:#e0dbd5;
}
html,body{height:100%;background:var(--bg);color:var(--text);
  font-family:'Source Sans 3',sans-serif;font-weight:300;overflow:hidden}

/* ── LAYOUT ── */
.viewer{
  position:fixed;inset:0;
  display:grid;
  grid-template-rows:48px 1fr auto;
}

/* ── TOP BAR ── */
.topbar{
  border-bottom:2px solid var(--red);
  display:flex;align-items:center;justify-content:space-between;
  padding:0 24px;
  background:#fff;
  z-index:20;position:relative;
  flex-shrink:0;
}
.back-btn{
  display:flex;align-items:center;gap:7px;
  text-decoration:none;color:var(--muted);
  font-size:10px;letter-spacing:.16em;text-transform:uppercase;
  transition:color .2s;
}
.back-btn:hover{color:var(--red)}
.back-btn svg{width:13px;height:13px}
.topbar-center{text-align:center}
.story-title-top{
  font-family:'Playfair Display',serif;
  font-size:15px;font-weight:400;color:var(--text);
  letter-spacing:-.01em;line-height:1.1;
}
.story-subject-top{
  font-size:9px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--red);margin-top:1px;
}
.topbar-right{
  display:flex;align-items:center;gap:16px;
}
.story-counter{
  font-size:10px;letter-spacing:.1em;color:var(--muted);
  text-align:right;
}
.blog-link-top{
  font-size:9px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--red);text-decoration:none;
  border:1px solid var(--red);padding:3px 8px;border-radius:2px;
  transition:all .15s;white-space:nowrap;
}
.blog-link-top:hover{background:var(--red);color:#fff}

/* ── IMAGE AREA ── */
.img-area{
  position:relative;overflow:hidden;background:#fff;
}
.slide{
  position:absolute;inset:0;
  display:flex;align-items:center;justify-content:center;
  transition:opacity .5s ease;
}
.slide.hidden{opacity:0;pointer-events:none}
.slide img{
  max-width:100%;max-height:100%;
  object-fit:contain;user-select:none;-webkit-user-drag:none;
}

/* CAPTION — white bar at bottom of image */
.caption-bar{
  position:absolute;bottom:0;left:0;right:0;
  background:rgba(255,255,255,.93);
  border-top:1px solid var(--line);
  padding:10px 80px 12px;
  min-height:52px;
  display:flex;align-items:center;
  z-index:10;
}
.caption-text{
  font-size:13px;line-height:1.65;
  color:var(--text);
  max-width:680px;margin:0 auto;
  text-align:center;
  font-style:italic;
  font-family:'Playfair Display',serif;
  font-weight:400;
}

/* Side nav arrows */
.nav-prev,.nav-next{
  position:absolute;top:0;
  bottom:52px;/* above caption */
  width:15%;background:none;border:none;cursor:pointer;
  z-index:15;display:flex;align-items:center;
  opacity:0;transition:opacity .2s;
}
.nav-prev{left:0;justify-content:flex-start;padding-left:16px}
.nav-next{right:0;justify-content:flex-end;padding-right:16px}
.img-area:hover .nav-prev,
.img-area:hover .nav-next{opacity:1}
.nav-arrow{
  width:34px;height:34px;border-radius:50%;
  background:rgba(255,255,255,.9);
  border:1px solid var(--line);
  box-shadow:0 2px 8px rgba(0,0,0,.15);
  display:flex;align-items:center;justify-content:center;
  color:var(--text);transition:all .2s;
}
.nav-prev:hover .nav-arrow,
.nav-next:hover .nav-arrow{background:#fff;border-color:var(--red);color:var(--red)}
.nav-arrow svg{width:13px;height:13px}

/* ── CONTROLS ── */
.controls{
  background:#fff;
  border-top:1px solid var(--line);
  padding:10px 24px 14px;
  flex-shrink:0;
  position:relative;
}

/* Progress */
.progress-wrap{
  height:3px;background:var(--line);border-radius:2px;
  cursor:pointer;margin-bottom:10px;position:relative;
}
.progress-fill{
  height:100%;background:var(--red);border-radius:2px;
  width:0%;pointer-events:none;
}
.progress-thumb{
  position:absolute;top:50%;transform:translateY(-50%);
  width:9px;height:9px;border-radius:50%;
  background:var(--red);left:0%;margin-left:-4px;
  pointer-events:none;box-shadow:0 0 0 2px rgba(196,18,48,.2);
}
.tick{position:absolute;top:0;width:1px;height:100%;background:rgba(0,0,0,.15)}

/* Button row */
.btn-row{
  display:flex;align-items:center;justify-content:center;gap:0;
}
.ctrl-btn{
  background:none;border:none;cursor:pointer;
  padding:8px 14px;color:var(--muted);
  transition:color .2s;display:flex;align-items:center;
}
.ctrl-btn:hover{color:var(--red)}
.ctrl-btn svg{width:17px;height:17px}
.ctrl-btn.play-pause{
  width:44px;height:44px;border-radius:50%;
  border:2px solid var(--red);
  color:var(--red);padding:0;margin:0 8px;
  display:flex;align-items:center;justify-content:center;
  background:#fff;
  transition:all .2s;
}
.ctrl-btn.play-pause:hover{background:var(--red);color:#fff}
.ctrl-btn.play-pause svg{width:14px;height:14px}

.time-display{
  position:absolute;right:24px;bottom:18px;
  font-size:10px;letter-spacing:.1em;color:var(--muted);
}

/* Story nav dots */
.story-nav{
  position:fixed;right:16px;top:50%;transform:translateY(-50%);
  display:flex;flex-direction:column;gap:6px;z-index:30;
}
.s-dot{
  width:6px;height:6px;border-radius:50%;
  background:var(--line);border:1px solid var(--muted);
  cursor:pointer;text-decoration:none;
  transition:all .2s;display:block;
}
.s-dot.active{background:var(--red);border-color:var(--red);transform:scale(1.3)}
.s-dot:hover{border-color:var(--red)}

/* Preloader */
.preloader{
  position:fixed;inset:0;background:#fff;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  z-index:100;transition:opacity .5s;
}
.preloader.hidden{opacity:0;pointer-events:none}
.pre-header{
  border-bottom:2px solid var(--red);
  padding-bottom:20px;margin-bottom:28px;
  text-align:center;width:300px;
}
.pre-title{
  font-family:'Playfair Display',serif;
  font-size:26px;font-weight:400;color:var(--text);
}
.pre-subject{
  font-size:10px;letter-spacing:.16em;text-transform:uppercase;
  color:var(--red);margin-top:6px;
}
.pre-bar-wrap{width:200px;height:2px;background:var(--line);border-radius:1px}
.pre-bar{height:100%;background:var(--red);width:0%;border-radius:1px;transition:width .3s}
.pre-pct{font-size:10px;color:var(--muted);margin-top:8px;text-align:center}

.kbd-hint{
  position:fixed;bottom:70px;left:50%;transform:translateX(-50%);
  font-size:9px;color:var(--line);letter-spacing:.1em;
  pointer-events:none;
  animation:fadeHint 3s 2s forwards;
}
@keyframes fadeHint{0%{opacity:1}100%{opacity:0}}

@media(max-width:640px){
  .topbar{padding:0 14px}
  .story-title-top{font-size:13px}
  .blog-link-top{display:none}
  .caption-bar{padding:8px 20px 10px}
  .controls{padding:8px 14px 12px}
  .story-nav{display:none}
  .time-display{right:14px;bottom:14px}
  .nav-prev,.nav-next{width:12%}
}
</style>
</head>
<body>

<!-- PRELOADER -->
<div class="preloader" id="preloader">
  <div class="pre-header">
    <div class="pre-title" id="preTitle">Loading</div>
    <div class="pre-subject" id="preSubject"></div>
  </div>
  <div class="pre-bar-wrap"><div class="pre-bar" id="preBar"></div></div>
  <div class="pre-pct" id="prePct">0%</div>
</div>

<div class="viewer">

  <!-- TOP BAR -->
  <div class="topbar">
    <a href="index.html" class="back-btn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M12 5l-7 7 7 7"/></svg>
      All Stories
    </a>
    <div class="topbar-center">
      <div class="story-title-top" id="storyTitle"></div>
      <div class="story-subject-top" id="storySubject"></div>
    </div>
    <div class="topbar-right">
      <div class="story-counter" id="storyCounter"></div>
      <a href="https://hivstories.org/blog/" class="blog-link-top" target="_blank" rel="noopener">Blog</a>
    </div>
  </div>

  <!-- IMAGE -->
  <div class="img-area" id="imgArea">
    <div class="slide" id="slide0"><img id="img0" alt=""></div>
    <div class="slide hidden" id="slide1"><img id="img1" alt=""></div>

    <button class="nav-prev" onclick="manualNav(-1)" aria-label="Previous">
      <div class="nav-arrow"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg></div>
    </button>
    <button class="nav-next" onclick="manualNav(1)" aria-label="Next">
      <div class="nav-arrow"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18l6-6-6-6"/></svg></div>
    </button>

    <div class="caption-bar">
      <p class="caption-text" id="captionText"></p>
    </div>
  </div>

  <!-- CONTROLS -->
  <div class="controls">
    <div class="progress-wrap" id="progressWrap">
      <div class="progress-ticks" id="ticks" style="position:absolute;inset:0;pointer-events:none"></div>
      <div class="progress-fill" id="progressFill"></div>
      <div class="progress-thumb" id="progressThumb"></div>
    </div>
    <div class="btn-row">
      <button class="ctrl-btn" onclick="manualNav(-1)" aria-label="Previous">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 18 9 12 15 6"/></svg>
      </button>
      <button class="ctrl-btn play-pause" id="btnPlay" onclick="togglePlay()">
        <svg id="iconPlay" viewBox="0 0 24 24" fill="currentColor"><polygon points="5,3 19,12 5,21"/></svg>
        <svg id="iconPause" viewBox="0 0 24 24" fill="currentColor" style="display:none"><rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/></svg>
      </button>
      <button class="ctrl-btn" onclick="manualNav(1)" aria-label="Next">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="9 18 15 12 9 6"/></svg>
      </button>
    </div>
    <div class="time-display" id="timeDisplay">0:00 / 0:00</div>
  </div>
</div>

<!-- STORY DOTS -->
<nav class="story-nav" id="storyNav"></nav>
<div class="kbd-hint">← → navigate &nbsp;·&nbsp; Space pause</div>

<script src="stories.js"></script>
<script>
const params   = new URLSearchParams(location.search);
const storyId  = params.get('id') || STORIES[0].id;
const story    = STORIES.find(s => s.id === storyId) || STORIES[0];
const storyIdx = STORIES.indexOf(story);
const slides   = story.images;

const audio         = new Audio(story.audio);
const preloader     = document.getElementById('preloader');
const progressFill  = document.getElementById('progressFill');
const progressThumb = document.getElementById('progressThumb');
const progressWrap  = document.getElementById('progressWrap');
const captionEl     = document.getElementById('captionText');
const timeEl        = document.getElementById('timeDisplay');
const iconPlay      = document.getElementById('iconPlay');
const iconPause     = document.getElementById('iconPause');

// Init header
document.title = `${story.title} — HIV Stories`;
document.getElementById('storyTitle').textContent   = story.title;
document.getElementById('storySubject').textContent = story.subject;
document.getElementById('storyCounter').textContent = `${storyIdx + 1} / ${STORIES.length}`;
document.getElementById('preTitle').textContent     = story.title;
document.getElementById('preSubject').textContent   = story.subject;

// Story nav dots
const dotNav = document.getElementById('storyNav');
STORIES.forEach((s, i) => {
  const a = document.createElement('a');
  a.className = 's-dot' + (i === storyIdx ? ' active' : '');
  a.href = `story.html?id=${s.id}`;
  a.title = s.title;
  dotNav.appendChild(a);
});

// Tick marks
const ticksEl = document.getElementById('ticks');
slides.forEach((sl, i) => {
  if (i === 0) return;
  const tick = document.createElement('div');
  tick.className = 'tick';
  tick.style.left = (sl.start / story.duration * 100) + '%';
  ticksEl.appendChild(tick);
});

// State
let currentSlide = 0;
let activeLayer  = 0;
let isPlaying    = false;
let userPaused   = false;
const preloadCache = {};

function imgEl(n)  { return document.getElementById(`img${n}`); }
function slideEl(n){ return document.getElementById(`slide${n}`); }

function showSlide(idx, instant) {
  if (idx < 0 || idx >= slides.length) return;
  currentSlide = idx;
  const sl  = slides[idx];
  const src = story.path + sl.src;
  const nextLayer = 1 - activeLayer;

  function doSwap() {
    const oldLayer = activeLayer;
    activeLayer = nextLayer;
    captionEl.textContent = sl.caption || '';
    if (instant) {
      slideEl(oldLayer).classList.add('hidden');
      slideEl(nextLayer).classList.remove('hidden');
    } else {
      slideEl(nextLayer).classList.remove('hidden');
      setTimeout(() => {
        if (activeLayer !== oldLayer) slideEl(oldLayer).classList.add('hidden');
      }, 550);
    }
  }

  if (preloadCache[src]) {
    imgEl(nextLayer).src = src; doSwap();
  } else {
    imgEl(nextLayer).onload = () => { preloadCache[src] = true; doSwap(); };
    imgEl(nextLayer).src = src;
  }

  // Preload neighbors
  [-1,1,2].forEach(off => {
    const ni = idx + off;
    if (ni < 0 || ni >= slides.length) return;
    const nsrc = story.path + slides[ni].src;
    if (preloadCache[nsrc]) return;
    const tmp = new Image();
    tmp.onload = () => { preloadCache[nsrc] = true; };
    tmp.src = nsrc;
  });
}

function fmt(s) {
  if (isNaN(s)) return '0:00';
  return `${Math.floor(s/60)}:${String(Math.floor(s%60)).padStart(2,'0')}`;
}

audio.addEventListener('timeupdate', () => {
  const ct  = audio.currentTime;
  const dur = audio.duration || story.duration;
  const pct = (ct / dur) * 100;
  progressFill.style.width = pct + '%';
  progressThumb.style.left = pct + '%';
  timeEl.textContent = `${fmt(ct)} / ${fmt(dur)}`;

  let target = slides.length - 1;
  for (let i = 0; i < slides.length; i++) {
    if (ct < slides[i].end) { target = i; break; }
  }
  if (target !== currentSlide) showSlide(target, false);
});

audio.addEventListener('ended', () => setPlayState(false));

function setPlayState(playing) {
  isPlaying = playing;
  iconPlay.style.display  = playing ? 'none' : '';
  iconPause.style.display = playing ? '' : 'none';
}

function togglePlay() {
  if (isPlaying) { audio.pause(); setPlayState(false); userPaused = true; }
  else { audio.play(); setPlayState(true); userPaused = false; }
}

function manualNav(dir) {
  const target = currentSlide + dir;
  if (target < 0 || target >= slides.length) return;
  const wasPlaying = isPlaying;
  audio.pause();
  audio.currentTime = slides[target].start;
  showSlide(target, false);
  if (wasPlaying && !userPaused) audio.play();
}

progressWrap.addEventListener('click', e => {
  const rect = progressWrap.getBoundingClientRect();
  const pct  = (e.clientX - rect.left) / rect.width;
  audio.currentTime = pct * (audio.duration || story.duration);
  if (!isPlaying && !userPaused) audio.play().then(() => setPlayState(true));
});

document.addEventListener('keydown', e => {
  if (e.key === 'ArrowRight') manualNav(1);
  else if (e.key === 'ArrowLeft') manualNav(-1);
  else if (e.key === ' ') { e.preventDefault(); togglePlay(); }
});

(function() {
  let sx = 0, sy = 0;
  const area = document.getElementById('imgArea');
  area.addEventListener('touchstart', e => {
    if (e.touches.length !== 1) return;
    sx = e.touches[0].clientX; sy = e.touches[0].clientY;
  }, {passive:true});
  area.addEventListener('touchend', e => {
    if (e.changedTouches.length !== 1) return;
    const dx = e.changedTouches[0].clientX - sx;
    const dy = e.changedTouches[0].clientY - sy;
    if (Math.abs(dy) > Math.abs(dx) || Math.abs(dx) < 50) return;
    manualNav(dx < 0 ? 1 : -1);
  }, {passive:true});
})();

// Load & start
let loaded = 0;
function checkReady() {
  loaded++;
  const pct = Math.min(100, Math.round(loaded / 2 * 100));
  document.getElementById('preBar').style.width = pct + '%';
  document.getElementById('prePct').textContent = pct + '%';
  if (loaded >= 2) startPlayer();
}
function startPlayer() {
  preloader.classList.add('hidden');
  showSlide(0, true);
  audio.play().then(() => setPlayState(true)).catch(() => setPlayState(false));
}

const firstImg = new Image();
firstImg.onload = () => { preloadCache[story.path + slides[0].src] = true; checkReady(); };
firstImg.src = story.path + slides[0].src;
audio.addEventListener('canplay', checkReady, {once:true});
audio.load();
setTimeout(() => { if (loaded < 2) startPlayer(); }, 4000);
</script>
</body>
</html>
